lkLabel}}<\u002Fstrong><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n<span style=\"padding:5px 11px;border-radius:999px;border:1px solid #3D3D3A;color:#C2C0B6;font-size:12px\">Demo<\u002Fspan>\n<div style=\"position:relative\">\n<button class=\"ghost\" sc-camel-on-click=\"{{toggleChan}}\" aria-label=\"Opciones del canal\" aria-haspopup=\"menu\" aria-expanded=\"{{chanOpen}}\" style=\"width:38px;height:38px;border-radius:10px;border:1px solid #30302E;background:{{chanBg}};cursor:pointer;display:grid;place-items:center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"3.5\" cy=\"8\" r=\"1.3\" fill=\"#C2C0B6\"><\u002Fcircle><circle cx=\"8\" cy=\"8\" r=\"1.3\" fill=\"#C2C0B6\"><\u002Fcircle><circle cx=\"12.5\" cy=\"8\" r=\"1.3\" fill=\"#C2C0B6\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n<sc-if value=\"{{chanOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"menu\" aria-label=\"Opciones del canal\" sc-camel-on-key-down=\"{{menuKey}}\" class=\"pop-down\" style=\"position:absolute;right:0;top:calc(100% + 6px);z-index:50;width:230px;padding:6px;border-radius:14px;border:1px solid #3D3D3A;background:#1F1E1D;box-shadow:0 18px 40px #00000080;display:flex;flex-direction:column;gap:2px\">\n<sc-for list=\"{{chanMenu}}\" as=\"m\" hint-placeholder-count=\"4\">\n<button role=\"menuitem\" class=\"item\" sc-camel-on-click=\"{{m.pick}}\" style=\"display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:{{m.c}};font:400 13.5px 'Anthropic Sans','Instrument Sans',sans-serif;text-align:left;cursor:pointer\">{{m.t}}<span style=\"margin-left:auto;font-size:12px;color:#87867F\">{{m.k}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"flex:1;overflow:auto;padding:40px 32px 24px\">\n<div style=\"max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:32px\">\n\n<div style=\"align-self:flex-end;max-width:80%;padding:11px 16px;border-radius:16px;background:#262624;font-size:15px;line-height:1.5;color:#FAF9F5\">¿Cómo está la flota esta mañana?<\u002Fdiv>\n\n<article style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"flex:none\"><path d=\"M12 2.5l2 7.5 7.5 2-7.5 2-2 7.5-2-7.5-7.5-2 7.5-2z\" fill=\"#D97757\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:560 15px 'Anthropic Serif','Source Serif 4',Georgia,serif;color:#FAF9F5\">Nova<\u002Fspan>\n<span style=\"font-size:12.5px;color:#87867F\">nave insignia, Sonnet 5.5<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0;font:400 17px/1.65 'Anthropic Serif','Source Serif 4',Georgia,serif;color:#F0EEE6;text-wrap:pretty\">Buenos días, Sergi. La noche ha sido tranquila en casi toda la flota. Hay tres cosas que conviene mirar hoy: el correo de matrícula, las pruebas de nova-studio y un agente que sigue apagado.<\u002Fp>\n\n<section aria-label=\"Estado de los escuadrones\" style=\"border:1px solid #30302E;border-radius:16px;background:#171614E6;overflow:hidden\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:14px 18px 12px\">\n<h2 style=\"margin:0;font:560 16px 'Anthropic Serif','Source Serif 4',Georgia,serif\">Estado de los escuadrones<\u002Fh2>\n<span style=\"margin-left:auto;font-size:12.5px;color:#9C9A92\">Toca uno para localizarlo en el radar<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{report}}\" as=\"r\" hint-placeholder-count=\"4\">\n<button class=\"row\" sc-camel-on-click=\"{{r.pick}}\" aria-pressed=\"{{r.on}}\" style=\"{{r.style}}\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 22 22\" aria-hidden=\"true\" style=\"grid-row:span 2;align-self:start;margin-top:1px\"><circle cx=\"11\" cy=\"11\" r=\"9\" fill=\"none\" stroke=\"{{r.c}}\" stroke-width=\"1\" opacity=\".55\"><\u002Fcircle><ellipse cx=\"11\" cy=\"11\" rx=\"9\" ry=\"3.4\" fill=\"none\" stroke=\"{{r.c}}\" stroke-width=\"1\" transform=\"rotate(-24 11 11)\"><\u002Fellipse><circle cx=\"11\" cy=\"11\" r=\"2.6\" fill=\"{{r.c}}\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font:600 14.5px 'Anthropic Sans','Instrument Sans',sans-serif;color:#FAF9F5\">{{r.n}}<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:10px\"><span style=\"{{r.pill}}\">{{r.s}}<\u002Fspan><svg class=\"rowgo\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\" style=\"opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s\"><circle cx=\"8\" cy=\"8\" r=\"5.5\" fill=\"none\" stroke=\"#C2C0B6\" stroke-width=\"1.3\"><\u002Fcircle><circle cx=\"8\" cy=\"8\" r=\"1.6\" fill=\"#C2C0B6\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n<span style=\"grid-column:2 / span 2;font:400 13.5px/1.55 'Anthropic Sans','Instrument Sans',sans-serif;color:#C2C0B6\">{{r.d}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fsection>\n\n<p style=\"margin:0;font:400 17px/1.65 'Anthropic Serif','Source Serif 4',Georgia,serif;color:#F0EEE6\">Si quieres, empiezo por las pruebas en rojo y te aviso cuando <code style=\"padding:1px 6px;border-radius:5px;background:#262624;color:#E8957A;font:400 14px 'JetBrains Mono',monospace\">dev-codigo<\u002Fcode> termine.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{quick}}\" as=\"q\" hint-placeholder-count=\"3\">\n<button class=\"chip\" sc-camel-on-click=\"{{q.pick}}\" style=\"height:38px;padding:0 15px;border-radius:999px;border:1px solid #3D3D3A;background:transparent;color:#F0EEE6;font:500 13.5px 'Anthropic Sans','Instrument Sans',sans-serif;cursor:pointer\">{{q.t}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Farticle>\n\n<div style=\"align-self:flex-end;max-width:80%;padding:11px 16px;border-radius:16px;background:#262624;font-size:15px;line-height:1.5;color:#FAF9F5\">Antes mira el log de backups de esta noche y dime si algo falló.<\u002Fdiv>\n\n<div style=\"display:flex;gap:12px;align-items:flex-start\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"flex:none;margin-top:10px\"><path class=\"breathe\" d=\"M12 2.5l2 7.5 7.5 2-7.5 2-2 7.5-2-7.5-7.5-2 7.5-2z\" fill=\"#D97757\"><\u002Fpath><\u002Fsvg>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-radius:14px;border:1px solid #30302E;background:#171614\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:#C2C0B6\">Nova está usando <code style=\"padding:2px 8px;border-radius:6px;background:#262624;color:#E8957A;font:400 12px 'JetBrains Mono',monospace\">leer_archivo<\u002Fcode><span style=\"font:400 12px 'JetBrains Mono',monospace;color:#87867F;overflow-wrap:anywhere\">/var/log/backups/2026-11-26.log<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative;height:2px;border-radius:2px;background:#262624;overflow:hidden\"><span class=\"drift\" style=\"position:absolute;top:0;width:35%;height:2px;border-radius:2px;background:#D97757\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Órdenes nuevas que da el usuario -->\n<sc-for list=\"{{sent}}\" as=\"m\" hint-placeholder-count=\"0\">\n<div class=\"appear\" style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"align-self:flex-end;max-width:80%;padding:11px 16px;border-radius:16px;background:#262624;font-size:15px;line-height:1.5;color:#FAF9F5;white-space:pre-wrap\">{{m.t}}<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font-size:13.5px;color:#C2C0B6\">\n<span style=\"{{m.dot}}\"><\u002Fspan>\n<span>Orden entregada a <strong style=\"{{m.toStyle}}\">{{m.to}}<\u002Fstrong>. Te aviso cuando haya novedades.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Compositor -->\n<div style=\"padding:0 32px 28px\">\n<div style=\"po ound:#100F0E;border:2px solid ${c}` : `display:block;width:${size - 2}px;height:${size - 2}px;border-radius:50%;background:#30302E;border:1px dashed #87867F`;\n    const small = (c) => `display:block;flex:none;width:8px;height:8px;border-radius:50%;background:${c};box-shadow:0 0 8px ${c}`;\n    const f = S.focusSq;\n    const vis = (sq) => !f || sq === f || sq === 'nova';\n\n    const agents = A.map(([id, sq, x, y, st, rol, model, act, tools], i) => {\n      const c = SQ[sq][1], lead = id === 'nova' ? 18 : id.startsWith('lider') ? 12 : 10, selected = S.selected === id;\n      const below = id === 'nova' || y < 170;\n      const lbl = id === 'nova'\n        ? `position:absolute;top:26px;left:50%;transform:translateX(-50%);font:italic 400 14px 'Anthropic Serif','Source Serif 4',Georgia,serif;color:#E8957A;white-space:nowrap;pointer-events:none`\n        : `position:absolute;left:50%;transform:translateX(-50%);${below ? 'top:22px' : 'bottom:22px'};font:${selected ? 500 : 400} 10.5px 'JetBrains Mono',monospace;color:${selected ? '#FAF9F5' : st === 'off' ? '#87867F' : '#C2C0B6'};white-space:nowrap;pointer-events:none;transition:color .15s;text-shadow:0 0 4px #141312,0 0 2px #141312`;\n      const tipX = x < 90 ? 'left:0;transform:none' : x > 250 ? 'left:auto;right:0;transform:none' : 'left:50%';\n      return {\n        id, sq: SQ[sq][0], sqKey: sq, c, rol, model, act, stTxt: stTxt[st], st, selected, isOn: st === 'on', tools: tools || T[sq],\n        pos: `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;display:grid;place-items:center;z-index:${selected ? 3 : 2};opacity:${vis(sq) ? 1 : .2};transition:opacity .3s`,\n        dot: dotOf(c, st, lead), lbl,\n        ping: `position:absolute;left:50%;top:50%;width:${lead}px;height:${lead}px;margin:-${lead / 2}px 0 0 -${lead / 2}px;border-radius:50%;border:1px solid ${c};animation-delay:${(i * 0.37) % 2.8}s;pointer-events:none`,\n        tip: `position:absolute;${below ? 'bottom:26px' : 'top:26px'};${tipX};display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:#30302E;border:1px solid #4D4C48;font:400 12px ${SANS};color:#FAF9F5;white-space:nowrap;pointer-events:none;z-index:5;box-shadow:0 8px 20px #00000066`,\n        tipDot: `width:6px;height:6px;border-radius:50%;background:${c}`,\n        pick: () => this.setState({ selected: id })\n      };\n    });\n    const sel = agents.find(a => a.selected) || agents[0];\n    const pillOf = (c) => `padding:3px 10px;border-radius:999px;font:500 12px ${SANS};color:${c};background:${c}1F;white-space:nowrap`;\n    const talk = agents.find(a => a.id === S.talkTo) || agents[0];\n    const b = S.broadcast;\n\n    // Menús\n    const menu = S.menu;\n    const toggle = (m) => () => this.setState({ menu: S.menu === m ? null : m });\n    const closeMenu = () => this.setState({ menu: null });\n    const menuKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); this.setState({ menu: null }); } };\n\n    const order = ['nova', 'srv', 'cls', 'dev', 'mdo'];\n    const agentMenu = order.map(k => ({\n      label: k === 'nova' ? 'Nave insignia' : SQ[k][0], dot: `width:6px;height:6px;border-radius:50%;background:${SQ[k][1]}`,\n      items: agents.filter(a => a.sqKey === k).map(a => {\n        const on = a.id === talk.id;\n        return { id: a.id, model: a.model, on, fg: a.st === 'off' ? '#87867F' : '#FAF9F5',\n          dot: dotOf(a.c, a.st, 8).replace('display:block', 'display:block;flex:none'),\n          style: `display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;background:${on ? '#262624' : 'transparent'};cursor:pointer;text-align:left`,\n          pick: () => this.setState({ talkTo: a.id, broadcast: false, menu: null }) };\n      })\n    }));\n\n    const send = (txt) => {\n      const t = (txt || '').trim();\n      if (!t) return;\n      const to = S.broadcast ? 'toda la flota' : talk.id, c = S.broadcast ? '#D97757' : talk.c;\n      this.setState({ sent: [...S.sent, { t, to, toStyle: `color:${c};font-weight:600`, dot: small(c) }], draft: '', menu: null });\n    };\n    const canSend = S.draft.trim().length > 0;\n\n    const tabsDef = [['flota', 'Flota'], ['proy', 'Proyectos'], ['arch', 'Archivo'], ['mem', 'Memoria']];\n    const tabIdx = tabsDef.findIndex(t => t[0] === S.tab);\n\n    const sqCount = (k) => agents.filter(a => a.sqKey === k).length;\n    const focus = (k) => () => this.setState({ focusSq: S.focusSq === k ? null : k, tab: 'flota' });\n    const dimOf = (k) => (!f || f === k) ? 1 : .15;\n\n    const OK = '#A9C08A', WARN = '#D9BC66', BAD = '#EE8F7C';\n    const rep = (k, s, c, d) => {\n      const on = f === k;\n      return { n: SQ[k][0], c: SQ[k][1], s, on, pill: pillOf(c), d, pick: focus(k),\n        style: `display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;padding:14px 18px;border:0;border-top:1px solid #262624;background:${on ? '#1F1E1D' : 'transparent'};box-shadow:${on ? `inset 2px 0 0 ${SQ[k][1]}` : 'none'};text-align:left;cursor:pointer` };\n    };\n    const hi = (t, a, sq, active) => ({ t, a, dot: `width:6px;height:6px;border-radius:50%;background:${SQ[sq][1]}`, style: `display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:9px;text-decoration:none;${active ? 'background:#262624' : ''}` });\n    const opDot = (c) => `width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px #141312,0 0 0 3px ${c}66;background:${c}`;\n    const proj = (n, k, pct, note) => ({ n, sq: SQ[k][0], c: SQ[k][1], pct: pct + ' %', note, bar: `display:block;height:100%;width:${pct}%;border-radius:4px;background:${SQ[k][1]};transition:filter .15s` });\n    const isTalking = talk.id === sel.id && !b;\n\n    return {\n      agents, sel, selDot: dotOf(sel.c, sel.st, 12), selPill: pillOf(sel.st === 'on' ? OK : sel.st === 'wait' ? '#C2C0B6' : '#9C9A92'),\n      talkTo: talk.id, talkModel: talk.model, talkLabel: b ? 'toda la flota' : talk.id,\n      talkStyle: `color:${b ? '#E8957A' : talk.c};font-weight:600`, talkDot: small(talk.c),\n      placeholder: b ? 'Da una orden a toda la flota…' : `Da una orden a ${talk.id}…`,\n      talk: () => this.setState({ talkTo: sel.id, broadcast: false }),\n      talkBtnTxt: isTalking ? `Canal abierto con ${sel.id}` : `Abrir canal con ${sel.id}`,\n      talkBtn: `height:44px;border-radius:12px;border:1px solid ${isTalking ? sel.c + '88' : '#4D4C48'};background:${isTalking ? sel.c + '1A' : '#262624'};color:#FAF9F5;font:500 14px ${SANS};cursor:pointer`,\n      broadcast: b, toggleBroadcast: () => this.setState({ broadcast: !b }),\n      bcStyle: `display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;cursor:pointer;font:500 13.5px ${SANS};border:1px solid ${b ? '#D97757' : '#3D3D3A'};background:${b ? '#D977571F' : 'transparent'};color:${b ? '#F4B9A3' : '#C2C0B6'}`,\n\n      menuOpen: !!menu, closeMenu, menuKey,\n      agentOpen: menu === 'agent', toggleAgent: toggle('agent'), agentMenu,\n      agentBtn: `display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;border:1px solid ${menu === 'agent' ? '#5E5D59' : '#3D3D3A'};background:${menu === 'agent' ? '#262624' : 'transparent'};color:#FAF9F5;font:500 13.5px ${SANS};cursor:pointer;opacity:${b ? .55 : 1}`,\n      agentChev: `transition:transform .2s;transform:rotate(${menu === 'agent' ? 180 : 0}deg)`,\n      userOpen: menu === 'user', toggleUser: toggle('user'), userBg: menu === 'user' ? '#262624' : 'transparent',\n      userChev: `margin-left:auto;transition:transform .2s;transform:rotate(${menu === 'user' ? 0 : 180}deg)`,\n      userMenu: [{ t: 'Perfil', k: '', c: '#FAF9F5' }, { t: 'Preferencias', k: 'Ctrl ,', c: '#FAF9F5' }, { t: 'Atajos de teclado', k: '?', c: '#FAF9F5' }, { t: 'Cerrar sesión', k: '', c: BAD }],\n      chanOpen: menu === 'chan', toggleChan: toggle('chan'), chanBg: menu === 'chan' ? '#262624' : 'transparent',\n      chanMenu: [\n        { t: 'Fijar canal', k: '', c: '#FAF9F5', pick: closeMenu },\n        { t: 'Guardar informe en el archivo', k: '', c: '#FAF9F5', pick: () => this.setState({ menu: null, tab: 'arch' }) },\n        { t: 'Silenciar avisos', k: '1 h', c: '#FAF9F5', pick: closeMenu },\n        { t: 'Vaciar conversación', k: '', c: BAD, pick: () => this.setState({ menu: null, sent: [] }) }\n      ],\n\n      draft: S.draft, onDraft: (e) => this.setState({ draft: e.target.value }),\n      onKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(S.draft); } },\n      sendDraft: () => send(S.draft), sent: S.sent,\n      sendStyle: `margin-left:auto;width:40px;height:40px;border-radius:12px;border:0;background:#D97757;cursor:${canSend ? 'pointer' : 'default'};display:grid;place-items:center;opacity:${canSend ? 1 : .45}`,\n      composerBorder: canSend ? '#5E5D59' : '#3D3D3A',\n      quick: ['Empezar por las pruebas', 'Responder a la matrícula', 'Reactivar domotica'].map(t => ({ t, pick: () => send(t) })),\n\n      tabs: tabsDef.map(([k, t]) => ({ t, on: S.tab === k, pick: () => this.setState({ tab: k }),\n        style: `position:relative;z-index:1;height:34px;border-radius:9px;border:0;background:transparent;color:${S.tab === k ? '#FAF9F5' : '#9C9A92'};font:500 13px ${SANS};cursor:pointer` })),\n      tabInk: `position:absolute;top:4px;bottom:4px;left:calc(4px + (100% - 8px) / 4 * ${tabIdx});width:calc((100% - 8px) / 4);border-radius:9px;background:#30302E;transition:left .25s cubic-bezier(.2,.8,.2,1)`,\n      isFlota: S.tab === 'flota', isProy: S.tab === 'proy', isArch: S.tab === 'arch', isMem: S.tab === 'mem',\n\n      dim: { srv: dimOf('srv'), cls: dimOf('cls'), dev: dimOf('dev'), mdo: dimOf('mdo') },\n      sqChips: ['srv', 'cls', 'dev', 'mdo'].map(k => {\n        const on = f === k;\n        return { n: SQ[k][0], k: String(sqCount(k)), on, pick: focus(k), dot: `width:7px;height:7px;border-radius:50%;background:${SQ[k][1]}`,\n          style: `display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;border:1px solid ${on ? SQ[k][1] + '99' : '#30302E'};background:${on ? SQ[k][1] + '1A' : 'transparent'};color:${on ? '#FAF9F5' : '#C2C0B6'};font:500 12.5px ${SANS};cursor:pointer` };\n      }),\n\n      report: [\n        rep('srv', 'En orden', OK, 'Los tres agentes responden y la copia nocturna terminó a las 03:12.'),\n        rep('cls', 'Atención', WARN, 'clase-correo está en espera con 3 correos de matrícula sin contestar.'),\n        rep('dev', 'Urgente', BAD, 'Dos pruebas de nova-studio fallan. dev-codigo ya las está corrigiendo.'),\n        rep('mdo', 'Atención', WARN, 'domotica está apagado desde ayer; el resto sigue activo.')\n      ],\n      groups: [\n        { label: 'Hoy', items: [hi('Informe de la flota', 'nova', 'nova', true), hi('Revisar backups nocturnos', 'srv-diagnostico', 'srv'), hi('Notas de Clase: tema 4', 'clase-notas', 'cls')] },\n        { label: 'Ayer', items: [hi('Presupuesto de empresas', 'clase-empresas', 'cls'), hi('Panel NovaHub: ajustes', 'nova', 'nova')] },\n        { label: 'Esta semana', items: [hi('Build de nova-studio, pruebas en rojo', 'dev-codigo', 'dev'), hi('Rotación de logs del servidor', 'sysadmin', 'mdo'), hi('Ideas para el vault', 'nova', 'nova')] }\n      ],\n      ops: [\n        { n: 'NovaStudio', s: 'Programación', dot: opDot(SQ.dev[1]) },\n        { n: 'NovaHub', s: 'Programación', dot: opDot(SQ.dev[1]) },\n        { n: 'Copias de seguridad', s: 'Servidor', dot: opDot(SQ.srv[1]) },\n        { n: 'Apuntes de Clase', s: 'Clase', dot: opDot(SQ.cls[1]) }\n      ],\n      projects: [\n        proj('NovaStudio', 'dev', 72, '2 pruebas en rojo'),\n        proj('NovaHub', 'dev', 45, 'refactor en curso'),\n        proj('Copias de seguridad', 'srv', 100, 'última copia a las 03:12'),\n        proj('Apuntes de Clase', 'cls', 57, 'tema 4 de 7')\n      ],\n      archive: [\n        { t: 'Informe de la flota', by: 'nova', d: '25 nov' },\n        { t: 'Log de backups nocturnos', by: 'srv-diagnostico', d: '25 nov' },\n        { t: 'Presupuesto para empresas', by: 'clase-empresas', d: '25 nov' },\n        { t: 'Informe de la flota', by: 'nova', d: '24 nov' },\n        { t: 'Baterías de estado sólido: resumen', by: 'investigador', d: '22 nov' }\n      ],\n      memory: [\n        'Prefieres que las pruebas en rojo se arreglen antes de fusionar nada.',\n        'Las copias nocturnas se lanzan a las 03:00 y se verifican antes de las 04:00.',\n        'domotica solo se reactiva con tu permiso.',\n        'En semana de matrícula, los correos de Clase van primero.'\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
